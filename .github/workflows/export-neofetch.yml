name: Export neofetch card

on:
  push:
    paths:
      - .github/workflows/export-neofetch.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download generated cards
        run: |
          set -euo pipefail
          mkdir -p assets
          base="https://neofetch-profile.vercel.app/api?username=Mike-Ski-615"
          config="https%3A%2F%2Fraw.githubusercontent.com%2FMike-Ski-615%2FMike-Ski-615%2Fmain%2Fneofetch.json%3Fv%3D6"
          curl -fsSL "$base&theme=github-dark&config=$config&v=6" -o assets/neofetch-dark.svg
          curl -fsSL "$base&theme=github-light&config=$config&v=6" -o assets/neofetch-light.svg
          test -s assets/neofetch-dark.svg
          test -s assets/neofetch-light.svg
          file assets/neofetch-dark.svg assets/neofetch-light.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/neofetch-dark.svg assets/neofetch-light.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Export neofetch card as static assets"
          git push
